<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Cloud Generator | DevOps Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header>
            <h1>Word <span>Cloud</span> Generator</h1>
            <p>Text frequency visualizer using HTML5 Canvas.</p>
        </header>

        <div class="app-grid">
            <div class="controls glass-panel">
                <div class="input-group">
                    <label for="text-input">Enter your text below:</label>
                    <textarea id="text-input" placeholder="Paste your text here to generate a beautiful word cloud... e.g. DevOps Jenkins Docker CI CD Git GitHub Pipeline Automation Containerization"></textarea>
                </div>
                <button id="generate-btn" class="glow-btn">
                    <span>Generate Cloud</span>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 5L20 12M20 12L13 19M20 12H4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <div class="canvas-container glass-panel">
                <canvas id="word-cloud-canvas" width="800" height="500"></canvas>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
